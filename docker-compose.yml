name: chronosfin

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronosfin
      POSTGRES_PASSWORD: chronosfin
      POSTGRES_DB: chronosfin
    ports:
      - "5433:5432"
    volumes:
      - chronosfin-db-data:/var/lib/postgresql/data

volumes:
  chronosfin-db-data:
